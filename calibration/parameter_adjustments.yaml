# HydroSIS 参数率定配置文件
# Upper Truckee River 流域
version: "1.0"
description: "Parameter calibration for Upper Truckee River basin"
author: "Generated by Claude Code"
date: "2025-10-23"

# =============================================================================
# 全局默认参数
# =============================================================================
# 这些参数将作为所有子流域和河道的初始默认值
# 如果CSV文件中已有参数，则CSV优先
global_defaults:
  # HBV产流模型参数
  hbv:
    # 雪融参数
    TT: 0.0            # 雪阈值温度 (°C)
    CFMAX: 3.5         # 度日因子 (mm/°C/day)
    CFR: 0.05          # 再冻结系数 (-)
    CWH: 0.1           # 持水能力 (-)

    # 土壤moisture参数
    FC: 150.0          # 最大土壤含水量/田间持水能力 (mm)
    LP: 0.6            # 蒸散限制比例 (-)
    BETA: 1.0          # 形状系数，控制土壤含水量对径流的影响 (-)

    # Reservoir routing参数
    K0: 0.30           # 快速响应系数 - 地表径流 (1/hr)
    K1: 0.10           # 慢速响应系数 - 壤中流 (1/hr)
    K2: 0.02           # 基流系数 - 地下水径流 (1/hr)
    PERC: 0.5          # 上层到下层的渗透率 (mm/hr)
    UZL: 5.0           # 上层阈值 (mm)
    MAXBAS: 3.0        # 基流最大值 (days)

    # 初始状态
    initial_soil: 25.0    # 初始土壤含水量 (mm)
    initial_upper: 2.0    # 初始上层reservoir储水 (mm)
    initial_lower: 10.0   # 初始下层reservoir储水 (mm)
    initial_snow: 0.0     # 初始雪水当量 (mm)

  # Muskingum河道汇流参数
  muskingum:
    K: 10.0            # 蓄量常数/波速传播时间 (hr)
    x: 0.2             # 权重系数，0=完全滞后，0.5=纯平移 (-)
    time_step: 1.0     # 时间步长 (hr)

# =============================================================================
# 按参数分区的调整
# =============================================================================
# 对每个参数分区应用特定的调整
zone_adjustments:
  # ---------------------------------------------------------------------------
  # Zone 1: 上游源头区（高海拔，陡坡，快速径流）
  # ---------------------------------------------------------------------------
  - zone_id: 1
    description: "Upper headwater zone - steep slopes, rapid runoff"
    runoff_parameters:
      hbv:
        # 增加快速径流成分（陡坡特征）
        K0:
          method: "multiply"
          value: 1.2        # 快速响应增加20%

        # 减少基流成分（岩石地表，入渗少）
        K2:
          method: "multiply"
          value: 0.8        # 基流减少20%

        # 土壤较浅
        FC:
          method: "multiply"
          value: 0.9        # 田间持水能力减少10%

        # 增加初始储水（考虑融雪积累）
        initial_soil:
          method: "add"
          value: 10.0       # 增加10mm

    routing_parameters:
      muskingum:
        # 缩短汇流时间（陡坡，流速快）
        K:
          method: "multiply"
          value: 0.7        # 波速传播时间减少30%

        # 增加平移成分
        x:
          method: "set"
          value: 0.25       # 直接设置为0.25

  # ---------------------------------------------------------------------------
  # Zone 2: 中游过渡区（中等坡度，混合下垫面）
  # ---------------------------------------------------------------------------
  - zone_id: 2
    description: "Middle transition zone - moderate slopes, mixed land cover"
    runoff_parameters:
      hbv:
        # 保持平衡的快慢径流
        K0:
          method: "multiply"
          value: 1.0

        K1:
          method: "multiply"
          value: 1.1        # 壤中流略微增加10%

        # 中等土壤深度
        FC:
          method: "multiply"
          value: 1.0        # 保持默认值

        # 增加渗透
        PERC:
          method: "multiply"
          value: 1.2        # 渗透率增加20%

    routing_parameters:
      muskingum:
        K:
          method: "multiply"
          value: 1.0        # 保持默认汇流时间

        x:
          method: "set"
          value: 0.20       # 标准权重

  # ---------------------------------------------------------------------------
  # Zone 3: 下游主河道区（缓坡，深厚土壤，显著基流）
  # ---------------------------------------------------------------------------
  - zone_id: 3
    description: "Lower main channel zone - gentle slopes, deep soils, significant baseflow"
    runoff_parameters:
      hbv:
        # 减少快速径流（缓坡）
        K0:
          method: "multiply"
          value: 0.85       # 快速响应减少15%

        # 增加基流成分（深厚土壤，地下水补给）
        K2:
          method: "multiply"
          value: 1.3        # 基流增加30%

        # 土壤较深
        FC:
          method: "multiply"
          value: 1.15       # 田间持水能力增加15%

        # 调整形状系数
        BETA:
          method: "multiply"
          value: 1.1        # 增加非线性

    routing_parameters:
      muskingum:
        # 延长汇流时间（缓坡，主河道）
        K:
          method: "multiply"
          value: 1.4        # 波速传播时间增加40%

        # 减少平移成分（更多滞后）
        x:
          method: "set"
          value: 0.15       # 更多衰减

  # ---------------------------------------------------------------------------
  # Zone 4-6: 其他分区（如果存在）
  # ---------------------------------------------------------------------------
  - zone_id: 4
    description: "Zone 4"
    runoff_parameters:
      hbv:
        K0:
          method: "multiply"
          value: 1.0
    routing_parameters:
      muskingum:
        K:
          method: "multiply"
          value: 1.0

# =============================================================================
# 特定子流域覆盖（可选）
# =============================================================================
# 对特定子流域进行单独调整，优先级最高
subbasin_overrides: []
  # 示例：如果子流域112需要特殊处理
  # - subbasin_id: 112
  #   description: "Special outlet subbasin"
  #   runoff_parameters:
  #     hbv:
  #       K0:
  #         method: "set"
  #         value: 0.40
  #       FC:
  #         method: "set"
  #         value: 200.0

# =============================================================================
# 率定策略说明
# =============================================================================
# 调整策略：
# 1. 如果径流系数偏高 -> 减少K0,K1，增加FC
# 2. 如果径流系数偏低 -> 增加K0,K1，减少FC
# 3. 如果峰值过早 -> 增加K（延长汇流时间）
# 4. 如果峰值过晚 -> 减少K（缩短汇流时间）
# 5. 如果峰值过高 -> 增加x（增加衰减），减少K0
# 6. 如果峰值过低 -> 减少x（减少衰减），增加K0
#
# 参数敏感性排序（从高到低）：
# 产流: FC > BETA > K0 > K1 > PERC > K2
# 汇流: K > x
