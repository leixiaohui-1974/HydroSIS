# Kubernetes部署配置
# HydroSIS MCP Server

apiVersion: v1
kind: Namespace
metadata:
  name: hydrosis

---
# ConfigMap - 配置文件
apiVersion: v1
kind: ConfigMap
metadata:
  name: hydrosis-config
  namespace: hydrosis
data:
  DATA_ROOT: "/data"
  HOST: "0.0.0.0"
  PORT: "8080"
  WORKERS: "4"
  LOG_LEVEL: "INFO"

---
# Secret - 敏感信息
apiVersion: v1
kind: Secret
metadata:
  name: hydrosis-secrets
  namespace: hydrosis
type: Opaque
stringData:
  jwt-secret: "your-jwt-secret-change-in-production"
  postgres-password: "hydrosis_password"
  minio-access-key: "minioadmin"
  minio-secret-key: "minioadmin"

---
# PersistentVolumeClaim - 数据存储
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hydrosis-data-pvc
  namespace: hydrosis
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: nfs-client

---
# Deployment - MCP Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydrosis-mcp-server
  namespace: hydrosis
  labels:
    app: hydrosis-mcp
    component: server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hydrosis-mcp
      component: server
  template:
    metadata:
      labels:
        app: hydrosis-mcp
        component: server
    spec:
      containers:
      - name: mcp-server
        image: hydrosis/mcp-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DATA_ROOT
          valueFrom:
            configMapKeyRef:
              name: hydrosis-config
              key: DATA_ROOT
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: hydrosis-config
              key: HOST
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: hydrosis-config
              key: PORT
        - name: WORKERS
          valueFrom:
            configMapKeyRef:
              name: hydrosis-config
              key: WORKERS
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: hydrosis-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        volumeMounts:
        - name: data-volume
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: hydrosis-data-pvc

---
# Service - MCP Server
apiVersion: v1
kind: Service
metadata:
  name: hydrosis-mcp-service
  namespace: hydrosis
  labels:
    app: hydrosis-mcp
spec:
  type: LoadBalancer
  selector:
    app: hydrosis-mcp
    component: server
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    name: http

---
# HorizontalPodAutoscaler - 自动伸缩
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hydrosis-mcp-hpa
  namespace: hydrosis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hydrosis-mcp-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
# Deployment - Celery Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydrosis-worker
  namespace: hydrosis
  labels:
    app: hydrosis-worker
    component: worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: hydrosis-worker
      component: worker
  template:
    metadata:
      labels:
        app: hydrosis-worker
        component: worker
    spec:
      containers:
      - name: celery-worker
        image: hydrosis/mcp-server:latest
        imagePullPolicy: IfNotPresent
        command: ["celery"]
        args:
          - "-A"
          - "mcp_server.tasks"
          - "worker"
          - "--loglevel=info"
          - "--concurrency=2"
        env:
        - name: DATA_ROOT
          value: "/data"
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/1"
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "16Gi"
            cpu: "8000m"
        volumeMounts:
        - name: data-volume
          mountPath: /data
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: hydrosis-data-pvc

---
# StatefulSet - Redis
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: hydrosis
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: redis-data
          mountPath: /data
        command: ["redis-server", "--appendonly", "yes"]
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

---
# Service - Redis
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: hydrosis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

---
# StatefulSet - PostgreSQL
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: hydrosis
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "hydrosis"
        - name: POSTGRES_USER
          value: "hydrosis"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hydrosis-secrets
              key: postgres-password
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi

---
# Service - PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: hydrosis
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---
# Ingress - 外部访问
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hydrosis-ingress
  namespace: hydrosis
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
spec:
  tls:
  - hosts:
    - mcp.hydrosis.example.com
    secretName: hydrosis-tls
  rules:
  - host: mcp.hydrosis.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hydrosis-mcp-service
            port:
              number: 80
