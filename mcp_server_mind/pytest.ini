[pytest]
# Pytest配置文件

# 异步测试模式
asyncio_mode = auto

# 测试路径
testpaths = tests

# 测试文件模式
python_files = test_*.py

# 测试函数模式
python_functions = test_*

# 测试类模式
python_classes = Test*

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes

# 标记
markers =
    asyncio: 异步测试
    slow: 慢速测试
    integration: 集成测试
    unit: 单元测试
